<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - TechFix IT Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand">
        <span class="brand-tech">Tech</span><span class="brand-fix">Fix</span>
        <span class="badge">Admin Portal</span>
      </a>
      <nav>
        <a href="/">Visitor Home</a>
        <a href="/admin/login.html" class="active">Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="card form-card" style="margin-top: 2rem;">
      <h2 style="margin-bottom: 0.25rem;">Admin Access</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Please sign in to manage IT shop appointments.</p>

      <div id="login-banner" class="banner banner-danger" style="display: none;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" placeholder="Enter admin username" required autocomplete="username">
          <span class="field-error" id="err-username"></span>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" placeholder="Enter admin password" required autocomplete="current-password">
          <span class="field-error" id="err-password"></span>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Sign In</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; School IT Department Computer Repair Activity. Admin Portal.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("login-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const bannerEl = document.getElementById("login-banner");
      const loginBtn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        bannerEl.style.display = "none";
        document.querySelectorAll(".field-error").forEach(el => el.textContent = "");

        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        let hasError = false;
        if (!username) {
          document.getElementById("err-username").textContent = "Username is required.";
          hasError = true;
        }
        if (!password) {
          document.getElementById("err-password").textContent = "Password is required.";
          hasError = true;
        }

        if (hasError) return;

        loginBtn.disabled = true;
        loginBtn.textContent = "Signing In...";

        try {
          const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({ username: username, password: password })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Login failed. Invalid username or password.");
          }

          window.location.href = "/admin/dashboard.html";
        } catch (err) {
          bannerEl.textContent = err.message;
          bannerEl.style.display = "block";
          loginBtn.disabled = false;
          loginBtn.textContent = "Sign In";
        }
      });
    });
  </script>
</body>
</html>
